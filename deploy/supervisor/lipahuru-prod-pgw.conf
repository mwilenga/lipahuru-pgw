; LipaHuru production payment gateway API — queue worker
;
; Install:
;   sudo cp deploy/supervisor/lipahuru-prod-pgw.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status "lipahuru-prod-pgw:*"
;
; Scheduler runs from cron, not Supervisor:
;   * * * * * cd /var/www/projects/tijatech/lipahuru/prod/pgw-api && php artisan schedule:run >> /dev/null 2>&1
;
; After each deploy:
;   php artisan queue:restart

[group:lipahuru-prod-pgw]
programs=lipahuru-prod-pgw-queue

[program:lipahuru-prod-pgw-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/projects/tijatech/lipahuru/prod/pgw-api
command=php /var/www/projects/tijatech/lipahuru/prod/pgw-api/artisan queue:work database --queue=webhooks,payments,default --sleep=3 --tries=1 --timeout=90 --max-time=3600
numprocs=4
user=www-data
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/projects/tijatech/lipahuru/prod/pgw-api/storage/logs/queue-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
